[project]
name = "funlab-flaskr"
version = "0.4.0"
description = "Funlab - A pluggable flask web application framework and adopt 'tabler' bootstrap UI template."
authors = [{ name = "sunny", email = "013.lin@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0,<4",
    "flask-login>=0.6.3,<0.7",
    "tzlocal>=5.3.1,<6",
    "funlab-libs",
]

[project.urls]
Repository = "https://github.com/sunnylin13/funlab-flaskr"

[dependency-groups]
dev = ["pytest>=8.3.0,<10"]

[tool.uv.sources]
funlab-libs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funlab"]
exclude = ["**/*.jpg", "**/*.png"]
